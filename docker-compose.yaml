version: '3.8'

services:
  my_postgres_db:
    image: postgres:16
    container_name: my_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./digital-library-system.sql:/docker-entrypoint-initdb.d/init.sql
  
  cognito-local:
    image: jagregory/cognito-local:latest
    container_name: library_cognito_local
    ports:
      - "9229:9229"
    volumes:
      - cognito_data:/app/.cognito
    environment:
      - PORT=9229

  # This job triggers automatically on "docker compose up" to create your pool IDs
  cognito-init:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: library_cognito_init
    volumes:
      - ./init_cognito.py:/app/init_cognito.py
    environment:
      AWS_COGNITO_ENDPOINT: http://cognito-local:9229
    entrypoint: ["python", "/app/init_cognito.py"]
    depends_on:
      - cognito-local

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: library_fastapi_backend
    restart: always
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DB_HOST: my_postgres_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Point backend boto3 configurations here
      AWS_COGNITO_ENDPOINT: http://cognito-local:9229 
      COGNITO_USER_POOL_ID: local_74D2F28B # Replace with script output
      COGNITO_APP_CLIENT_ID: local_mockclientid123 # Replace with script output
    depends_on:
      - my_postgres_db
      - cognito-init

  web_ui:
    image: nginx:alpine
    container_name: library_vanilla_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./script.js:/usr/share/nginx/html/script.js
      - ./styles.css:/usr/share/nginx/html/styles.css
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  cognito_data:
