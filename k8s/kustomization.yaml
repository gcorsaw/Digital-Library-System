# Kustomize entry point for the application's Kubernetes resources.
# Apply the combined manifests with `kubectl apply -k <directory>`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include each application component in the Kustomize build.
# The resources are going to define the initial set of Kubernetes manifests
# that Kustomize should pull into its build process. It acts as an explict
# entry point list, instructing Kustomize which specify files, directories,
# or remote paths to process and apply transformations to.
resources:
  - frontend.yaml
  - backend.yaml
  - postgres.yaml