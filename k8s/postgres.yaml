# Provides a stable network identity for the database StatefulSet. This
# headless Service resolves directly to its selected Pods.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Runs PostgreSQL as a StatefulSet so its Pod identity and storage are stable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  # The StatefulSet uses the Service above for stable network identity.
  serviceName: postgres
  # One database instance is configured; scaling this StatefulSet alone does
  # not provide database replication or high availability.
  replicas: 1
  # Match this label against the Pod template so the StatefulSet manages its Pod.
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # PostgreSQL container image and major version.
          image: postgres:16
          # PostgreSQL accepts database connections on port 5432.
          ports:
            - containerPort: 5432
          # Initialize the database name and credentials from the library Secret.
          env:
            - name: POSTGRES_DB
              value: digital_library
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Persist database files so they survive replacement of the Pod.
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # Report ready only after PostgreSQL accepts connections to this DB.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          # Requests inform scheduling; limits cap CPU and memory consumption.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
  # Provision persistent storage for the StatefulSet Pod. The requested size
  # and access mode must be supported by the cluster's storage provisioner.
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi