# Supplies non-sensitive database connection settings to the backend.
# Credentials and the JWT signing key are provided separately from a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: digital_library
---
# Runs the backend application and maintains its Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # A single replica is configured for this environment.
  replicas: 1
  # Match this label against the Pod template so the Deployment manages its Pods.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Use the locally built image; nodes may pull it if it is not cached.
          image: digital-library-backend:local
          imagePullPolicy: IfNotPresent
          # The backend listens for HTTP requests on port 8000.
          ports:
            - containerPort: 8000
          # Load database host, port, and name from the ConfigMap.
          envFrom:
            - configMapRef:
                name: backend-config
          # Keep credentials and signing material in a Secret, not the ConfigMap.
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: library-secrets
                  key: JWT_SECRET_KEY
          # Only send traffic to the Pod when its health endpoint is ready.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          # Restart the container if its health endpoint stops responding.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          # Requests inform scheduling; limits cap CPU and memory consumption.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# Exposes backend Pods inside the cluster on port 8000.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000